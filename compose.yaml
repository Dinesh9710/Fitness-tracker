services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=dineshvar
      - DOCKER_INFLUXDB_INIT_PASSWORD=######  # Change this!
      - DOCKER_INFLUXDB_INIT_ORG=myhomelab
      - DOCKER_INFLUXDB_INIT_BUCKET=fitness_stats
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-token-123
    restart: always

  grafana:
    image: grafana/grafana-oss
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=YourGrafanaPassword123  # Change this!
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - influxdb
    restart: always

volumes:
  influxdb-data:
  grafana-data:
